[build-system]
requires = [
  "hatchling",
  "hatch-vcs",
  "hatch-jupyter-builder>=0.10",
  "hatch-requirements-txt",
]
build-backend = "hatchling.build"

[project]
name = "binderhub"
dynamic = ["version", "dependencies"]
description = "Turn a Git repo into a collection of interactive notebooks"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD" }
authors = [
  { name = "Project Jupyter Contributors", email = "jupyter@googlegroups.com" },
]
keywords = ["reproducible", "science", "environments", "docker", "kubernetes"]

[project.urls]
Homepage = "https://binderhub.readthedocs.io/en/latest/"
Documentation = "https://binderhub.readthedocs.io/en/latest/"
Funding = "https://jupyter.org/about"
Source = "https://github.com/jupyterhub/binderhub/"
Tracker = "https://github.com/jupyterhub/binderhub/issues"

[project.optional-dependencies]
# pycurl is an optional dependency which improves performance
#
# - pycurl requires both `curl-config` and `gcc` to be available when
#   installing it from source.
# - pycurl should always be used in production, but it's not relevant
#   for building documentation which inspects the source code.
#
pycurl = ["pycurl"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.build]
artifacts = [
  "binderhub/static/dist/**",
]

[tool.hatch.build.targets.wheel]
packages = ["binderhub"]

[tool.hatch.build.hooks.vcs]
version-file = "binderhub/_version.py"

# https://hatch-jupyter-builder.readthedocs.io/en/stable/source/reference/api/hatch_jupyter_builder.html#hatch_jupyter_builder.utils.npm_builder
[tool.hatch.build.hooks.jupyter-builder]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = ["binderhub/static/dist/bundle.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "webpack"
build_dir = "binderhub/static/dist/"
source_dir = "binderhub/static/js/"
npm = ["npm"]


# black is used for autoformatting Python code
[tool.black]
# target-version should be all supported versions, see
# https://github.com/psf/black/issues/751#issuecomment-473066811
target-version = ["py310", "py311", "py312"]


# The default isort output conflicts with black autoformatting.
# Tell isort to behave nicely with black
# See https://pycqa.github.io/isort/docs/configuration/black_compatibility.html
# for more information.
[tool.isort]
profile = "black"


# pytest is used for running Python based tests
[tool.pytest.ini_options]
# Run playwright tests only on firefox
# Retain playwright traces after failing tests, to help with debugging
addopts = "--verbose --color=yes --durations=10 --browser firefox --tracing retain-on-failure"
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = "60"

# pytest-cov / coverage is used to measure code coverage of tests
[tool.coverage.run]
omit = [
  "binderhub/tests/*",
  "binderhub/_version.py",
]
parallel = true
